<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Warning Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="mb-4">
            <a href="/" class="text-blue-600 hover:underline">← Back to Dashboard</a>
        </div>
        <h1 class="text-3xl font-bold mb-2">Early Warning Analysis</h1>
        <p class="text-sm text-gray-600 mb-6">Anomalies are early warning signals for OTA safety; this view is read-only and does not affect decisions.</p>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <form id="queryForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Device ID</label>
                    <input type="text" id="deviceId" name="deviceId" placeholder="Enter device ID" required
                        class="block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    Run Check
                </button>
            </form>
        </div>

        <div id="result" class="hidden bg-white rounded-lg shadow p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold">Analysis Result (single window)</h2>
                <div id="resultBadge" class="text-sm"></div>
            </div>

            <div class="border-b border-gray-200 mb-4">
                <nav class="-mb-px flex space-x-6" aria-label="Tabs">
                    <button id="tab-ew" type="button"
                        class="tab-btn whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm border-blue-500 text-blue-600">
                        Early Warning Signal
                    </button>
                    <button id="tab-risk" type="button"
                        class="tab-btn whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Risk &amp; Decision Context
                    </button>
                </nav>
            </div>

            <div id="tabContent-ew" class="space-y-4"></div>
            <div id="tabContent-risk" class="space-y-4 hidden"></div>
        </div>
    </div>

    <script>
        const recentChecks = [];
        const RECENT_CHECKS_MAX = 5;

        function setActiveTab(tab) {
            const ewBtn = document.getElementById('tab-ew');
            const riskBtn = document.getElementById('tab-risk');
            const ew = document.getElementById('tabContent-ew');
            const risk = document.getElementById('tabContent-risk');

            if (!ewBtn || !riskBtn || !ew || !risk) return;

            const isEw = tab === 'ew';
            ew.classList.toggle('hidden', !isEw);
            risk.classList.toggle('hidden', isEw);

            ewBtn.classList.toggle('border-blue-500', isEw);
            ewBtn.classList.toggle('text-blue-600', isEw);
            ewBtn.classList.toggle('border-transparent', !isEw);
            ewBtn.classList.toggle('text-gray-500', !isEw);

            riskBtn.classList.toggle('border-blue-500', !isEw);
            riskBtn.classList.toggle('text-blue-600', !isEw);
            riskBtn.classList.toggle('border-transparent', isEw);
            riskBtn.classList.toggle('text-gray-500', isEw);
        }

        function renderRiskBadge(riskLevel) {
            const risk = typeof riskLevel === 'string' ? riskLevel : null;
            if (!risk) return '';
            if (risk === 'high') return '<span class="px-2 py-1 rounded-md text-xs font-medium bg-red-100 text-red-800">high</span>';
            if (risk === 'medium') return '<span class="px-2 py-1 rounded-md text-xs font-medium bg-yellow-100 text-yellow-800">medium</span>';
            if (risk === 'low') return '<span class="px-2 py-1 rounded-md text-xs font-medium bg-green-100 text-green-800">low</span>';
            return `<span class="px-2 py-1 rounded-md text-xs font-medium bg-gray-100 text-gray-800">${risk}</span>`;
        }

        function recommendationText({ risk_level }) {
            // Read-only mapping from backend risk_level. Anomaly tab does NOT compute OTA decisions.
            // OTA allow/delay/block is computed ONLY by computeRollingOtaDecision over anomaly_events.
            if (risk_level === 'low') return 'OTA update allowed';
            if (risk_level === 'medium') return 'OTA update not recommended without caution';
            if (risk_level === 'high') return 'OTA update blocked due to anomaly risk';
            return 'No recommendation available';
        }

        function pushRecentCheck(check) {
            recentChecks.unshift(check);
            if (recentChecks.length > RECENT_CHECKS_MAX) recentChecks.length = RECENT_CHECKS_MAX;
        }

        function elevatedCountHint() {
            if (recentChecks.length === 0) return null;

            const elevated = recentChecks.filter((c) => {
                if (!c || typeof c !== 'object') return false;
                return c.risk_level === 'medium' || c.risk_level === 'high';
            }).length;

            return `${elevated} of last ${recentChecks.length} checks were elevated/high`;
        }

        function renderDeviationsTable(deviations) {
            if (!Array.isArray(deviations) || deviations.length === 0) {
                return '';
            }

            const rows = deviations
                .filter(d => d && typeof d === 'object')
                .map((d) => {
                    const feature = d.feature ?? d.name ?? null;
                    if (!feature || typeof feature !== 'string' || !feature.trim()) return null;

                    const current = typeof d.current_value === 'number' ? d.current_value
                        : typeof d.value === 'number' ? d.value
                        : null;
                    const ref = typeof d.reference === 'number' ? d.reference
                        : typeof d.ref === 'number' ? d.ref
                        : typeof d.p99 === 'number' ? d.p99
                        : null;
                    const deviation = typeof d.deviation_score === 'number' ? d.deviation_score : null;
                    const direction = typeof deviation === 'number'
                        ? (deviation > 0 ? '↑' : (deviation < 0 ? '↓' : '→'))
                        : null;
                    const severity = typeof d.severity === 'string' ? d.severity : null;

                    return { feature, current, ref, deviation, direction, severity };
                })
                .filter(r => r !== null);

            if (!rows.length) return '';

            return `
                <div class="overflow-x-auto border border-gray-200 rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Feature</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Direction</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Current</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Reference</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Severity</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${rows.map(r => `
                                <tr>
                                    <td class="px-4 py-2 text-sm text-gray-900 font-medium">${r.feature}</td>
                                    <td class="px-4 py-2 text-sm text-gray-700">${r.direction || ''}</td>
                                    <td class="px-4 py-2 text-sm text-gray-700 font-mono">${typeof r.current === 'number' ? r.current.toFixed(4) : ''}</td>
                                    <td class="px-4 py-2 text-sm text-gray-700 font-mono">${typeof r.ref === 'number' ? r.ref.toFixed(4) : ''}</td>
                                    <td class="px-4 py-2 text-sm text-gray-700">${r.severity || ''}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        document.getElementById('queryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const deviceId = document.getElementById('deviceId').value.trim();

            if (!deviceId) {
                alert('Please enter a device ID');
                return;
            }

            try {
                // Manual analysis endpoint (READ-ONLY): does NOT write devices/anomaly or anomaly_events
                const response = await fetch(`/api/anomaly/${encodeURIComponent(deviceId)}/analyze`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                });
                const data = await response.json();
                const resultDiv = document.getElementById('result');
                const ewContent = document.getElementById('tabContent-ew');
                const riskContent = document.getElementById('tabContent-risk');
                const badge = document.getElementById('resultBadge');

                if (response.ok && data.success && data.data) {
                    const result = data.data;
                    const score = typeof result.score === 'number' ? result.score : null;
                    const hard = typeof result.threshold === 'number'
                        ? result.threshold
                        : (typeof result.thresholds?.hard === 'number' ? result.thresholds.hard : null);
                    const soft = typeof result.soft_threshold === 'number'
                        ? result.soft_threshold
                        : (typeof result.thresholds?.soft === 'number' ? result.thresholds.soft : null);
                    const risk = typeof result.risk_level === 'string' ? result.risk_level : null;
                    const modelVersion = typeof result.model_version === 'string' && result.model_version.trim()
                        ? result.model_version.trim()
                        : null;

                    pushRecentCheck({
                        at: new Date().toISOString(),
                        risk_level: risk,
                    });
                    const hint = elevatedCountHint();
                    const recommendation = recommendationText({ risk_level: risk });

                    if (badge) badge.innerHTML = renderRiskBadge(risk);

                    const deviationsHtml = renderDeviationsTable(result.deviations);

                    if (ewContent) {
                        ewContent.innerHTML = `
                            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-sm text-blue-900">
                                <div class="font-semibold mb-1">Early Warning Signal</div>
                                <div>This is a read-only analysis of the latest inference window. OTA decisions use rolling history, not this view.</div>
                            </div>

                            <div class="bg-white border border-gray-200 rounded-lg p-4">
                                <div class="font-semibold mb-2">Decision Summary</div>
                                <div class="grid grid-cols-1 md:grid-cols-${modelVersion ? 2 : 1} gap-4">
                                    <div>
                                        <div class="text-xs text-gray-600">Risk Level</div>
                                        <div class="mt-1">${renderRiskBadge(risk)}</div>
                                    </div>
                                    ${modelVersion ? `
                                    <div>
                                        <div class="text-xs text-gray-600">Model Version</div>
                                        <div class="mt-1 text-sm font-mono">${modelVersion}</div>
                                    </div>
                                    ` : ''}
                                </div>
                                <div class="mt-3 text-sm text-gray-800"><b>Recommendation:</b> ${recommendation}</div>
                                ${hint ? `<div class="mt-2 text-xs text-gray-500">${hint}</div>` : ''}
                            </div>

                            <div class="grid grid-cols-3 gap-4">
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-sm text-gray-600">Anomaly Score</div>
                                    <div class="text-2xl font-bold">${typeof score === 'number' ? score.toFixed(4) : ''}</div>
                                    <div class="text-xs text-gray-500 mt-2">Score is distribution-based (not a probability).</div>
                                </div>
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-sm text-gray-600">Soft Threshold</div>
                                    <div class="text-xl font-mono">${typeof soft === 'number' ? soft.toFixed(4) : ''}</div>
                                </div>
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-sm text-gray-600">Hard Threshold</div>
                                    <div class="text-xl font-mono">${typeof hard === 'number' ? hard.toFixed(4) : ''}</div>
                                </div>
                            </div>

                            ${deviationsHtml ? `
                            <div class="p-4 bg-gray-50 border border-gray-200 rounded">
                                <div class="font-semibold mb-2">Top Feature Deviations</div>
                                ${deviationsHtml}
                            </div>
                            ` : ''}
                        `;
                    }

                    if (riskContent) {
                        riskContent.innerHTML = `
                            <div class="bg-white border border-gray-200 rounded-lg p-4">
                                <div class="font-semibold mb-2">Inference Result (single window)</div>
                                <div class="grid grid-cols-1 md:grid-cols-${modelVersion ? 2 : 1} gap-4">
                                    <div>
                                        <div class="text-xs text-gray-600">Risk Level</div>
                                        <div class="mt-1">${renderRiskBadge(risk)}</div>
                                    </div>
                                    ${modelVersion ? `
                                    <div>
                                        <div class="text-xs text-gray-600">Model Version</div>
                                        <div class="mt-1 text-sm font-mono">${modelVersion}</div>
                                    </div>
                                    ` : ''}
                                </div>
                                <div class="mt-3 text-sm text-gray-800">
                                    This panel shows the latest inference window only. OTA enforcement uses a rolling history via computeRollingOtaDecision.
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-4 mt-4">
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-xs text-gray-600">Anomaly Score</div>
                                    <div class="text-xl font-mono">${typeof score === 'number' ? score.toFixed(4) : ''}</div>
                                </div>
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-xs text-gray-600">Soft Threshold</div>
                                    <div class="text-xl font-mono">${typeof soft === 'number' ? soft.toFixed(4) : ''}</div>
                                </div>
                                <div class="p-4 bg-gray-50 rounded">
                                    <div class="text-xs text-gray-600">Hard Threshold</div>
                                    <div class="text-xl font-mono">${typeof hard === 'number' ? hard.toFixed(4) : ''}</div>
                                </div>
                            </div>
                        `;
                    }

                    resultDiv.classList.remove('hidden');
                    setActiveTab('ew');
                } else {
                    const errorMsg = data.message || data.error || 'Inference failed';
                    const errorHtml = `<div class="text-red-600">Error: ${errorMsg}</div>`;
                    if (ewContent) ewContent.innerHTML = errorHtml;
                    if (riskContent) riskContent.innerHTML = '';
                    resultDiv.classList.remove('hidden');
                }
            } catch (error) {
                const ewContent = document.getElementById('tabContent-ew');
                if (ewContent) ewContent.innerHTML = `<div class="text-red-600">Error: ${error.message}</div>`;
                document.getElementById('result').classList.remove('hidden');
            }
        });

        document.getElementById('tab-ew')?.addEventListener('click', () => setActiveTab('ew'));
        document.getElementById('tab-risk')?.addEventListener('click', () => setActiveTab('risk'));
    </script>
</body>
</html>
